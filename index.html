<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صندوق العائلة الشهري</title>
  <!-- مكتبات Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --primary: #2c3e50;
      --accent: #27ae60;
      --danger: #e74c3c;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 15px;
      color: #333;
    }
    .header-card {
      background: linear-gradient(135deg, #2c3e50, #3498db);
      color: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      position: relative;
    }
    .cloud-status {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 0.8rem;
      background: rgba(255,255,255,0.2);
      padding: 4px 10px;
      border-radius: 12px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }
    .stat-box {
      background: rgba(255,255,255,0.15);
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }
    .stat-box h4 { margin: 0 0 5px 0; font-size: 0.85rem; opacity: 0.9; }
    .stat-box p { margin: 0; font-size: 1.2rem; font-weight: bold; }
    
    .actions-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 5px;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    button.btn-danger { background: var(--danger); }
    button.btn-success { background: var(--accent); }
    
    .section-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 20px 0 10px 0;
      color: var(--primary);
    }
    
    .members-grid {
      display: grid;
      gap: 12px;
    }
    .member-card {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .member-name { font-weight: bold; font-size: 1rem; }
    .balance-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.95rem;
    }
    .balance-negative { background: #fde8e8; color: var(--danger); }
    .balance-positive { background: #e8f8f0; color: var(--accent); }
    .balance-zero { background: #eef2f5; color: #7f8c8d; }

    .loans-list, .history-list {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 10px 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .list-item:last-child { border-bottom: none; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0 15px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="header-card">
    <span class="cloud-status" id="cloudStatus">جاري الاتصال بالسحابة... 🟡</span>
    <h2 style="margin: 0;">صندوق العائلة الشهري</h2>
    <div class="stats-grid">
      <div class="stat-box">
        <h4>المبلغ الإجمالي المجموع</h4>
        <p id="totalFund">0 ر.ع</p>
      </div>
      <div class="stat-box">
        <h4>المتبقي الصافي</h4>
        <p id="remainingFund">0 ر.ع</p>
      </div>
    </div>
  </div>

  <div class="actions-bar">
    <button class="btn-success" onclick="openModal('payModal')">+ تسجيل دفع</button>
    <button class="btn-danger" onclick="openModal('loanModal')">- تسجيل اقتراض</button>
    <button onclick="applyMonthlyDeduction()">📅 بدء شهر جديد (-5 ر.ع)</button>
  </div>

  <div class="section-title">حالة دفع الأعضاء (9 أشخاص)</div>
  <div class="members-grid" id="membersContainer"></div>

  <div class="section-title">سجل القروض النشطة</div>
  <div class="loans-list" id="loansContainer">
    <div style="text-align: center; color: #888;">لا يوجد اقتراض حالي</div>
  </div>

  <div class="section-title">سجل عمليات الدفع بالتاريخ</div>
  <div class="history-list" id="historyContainer"></div>

  <!-- نافذة تسجيل الدفع -->
  <div class="modal" id="payModal">
    <div class="modal-content">
      <h3>تسجيل دفع شهري</h3>
      <label>اسم الشخص</label>
      <select id="payMemberSelect"></select>
      <label>المبلغ المدفوع (ريال عماني)</label>
      <input type="number" id="payAmount" value="5" min="1">
      <label>تاريخ الدفع</label>
      <input type="date" id="payDate">
      <button class="btn-success" style="width: 100%;" onclick="submitPayment()">تأكيد الدفع</button>
      <button style="width: 100%; margin-top: 5px; background: #95a5a6;" onclick="closeModal('payModal')">إلغاء</button>
    </div>
  </div>

  <!-- نافذة الاقتراض -->
  <div class="modal" id="loanModal">
    <div class="modal-content">
      <h3>تسجيل اقتراض من الصندوق</h3>
      <label>اسم المقترض</label>
      <input type="text" id="borrowerName" placeholder="أدخل اسم المقترض">
      <label>المبلغ المقترض (ريال عماني)</label>
      <input type="number" id="loanAmount" placeholder="مثال: 200">
      <button class="btn-danger" style="width: 100%;" onclick="submitLoan()">تسجيل القرض</button>
      <button style="width: 100%; margin-top: 5px; background: #95a5a6;" onclick="closeModal('loanModal')">إلغاء</button>
    </div>
  </div>

  <script>
    // تهيئة Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyChOoPsDe_X3c6NqBVHgV0e7gdKkLC2qDM",
      authDomain: "familyfund-997aa.firebaseapp.com",
      projectId: "familyfund-997aa",
      storageBucket: "familyfund-997aa.firebasestorage.app",
      messagingSenderId: "393917300456",
      appId: "1:393917300456:web:4b7431766eb08f916b935d",
      measurementId: "G-K2E4R9HXV3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const INITIAL_MEMBERS = ["ريا", "فاطمة", "شمسة", "نجية", "اصيله", "جواهر", "زينة", "ثريا", "مريم"];
    
    let state = {
      members: INITIAL_MEMBERS.map(name => ({ name, balance: 0 })),
      totalFund: 0,
      loans: [],
      history: []
    };

    document.getElementById('payDate').valueAsDate = new Date();

    // الاستماع للتغييرات السحابية لحظياً (Real-Time Synchronization)
    db.collection('familyFund').doc('state').onSnapshot((doc) => {
      if (doc.exists) {
        state = doc.data();
      } else {
        // إنشاء المستند لأول مرة في السحابة
        saveData();
      }
      document.getElementById('cloudStatus').innerText = 'متصل بالسحابة 🟢';
      render();
    }, (error) => {
      console.error("خطأ في الاتصال بالسحابة:", error);
      document.getElementById('cloudStatus').innerText = 'خطأ بالاتصال 🔴';
    });

    // حفظ البيانات في السحابة
    function saveData() {
      db.collection('familyFund').doc('state').set(state)
        .catch(err => console.error("خطأ في الحفظ السحابي:", err));
    }

    function render() {
      // 1. الأعضاء
      const membersContainer = document.getElementById('membersContainer');
      const paySelect = document.getElementById('payMemberSelect');
      membersContainer.innerHTML = '';
      paySelect.innerHTML = '';

      state.members.forEach((m, idx) => {
        paySelect.innerHTML += `<option value="${idx}">${m.name}</option>`;
        
        let badgeClass = 'balance-zero';
        let badgeText = `${m.balance} ر.ع`;
        if (m.balance < 0) badgeClass = 'balance-negative';
        else if (m.balance > 0) {
          badgeClass = 'balance-positive';
          badgeText = `+${m.balance} ر.ع`;
        }

        membersContainer.innerHTML += `
          <div class="member-card">
            <span class="member-name">${m.name}</span>
            <div>
              <span class="balance-badge ${badgeClass}">${badgeText}</span>
              <button style="padding: 4px 8px; font-size: 0.8rem; margin-right: 5px;" onclick="editBalance(${idx})">تعديل</button>
            </div>
          </div>
        `;
      });

      // 2. الإجماليات والقروض
      const totalActiveLoans = (state.loans || []).reduce((sum, l) => sum + l.amount, 0);
      document.getElementById('totalFund').innerText = `${state.totalFund || 0} ر.ع`;
      document.getElementById('remainingFund').innerText = `${(state.totalFund || 0) - totalActiveLoans} ر.ع`;

      // 3. قائمة القروض
      const loansContainer = document.getElementById('loansContainer');
      if (!state.loans || state.loans.length === 0) {
        loansContainer.innerHTML = '<div style="text-align: center; color: #888; padding: 10px;">لا يوجد اقتراض حالي</div>';
      } else {
        loansContainer.innerHTML = state.loans.map((l, i) => `
          <div class="list-item">
            <div><strong>${l.borrower}</strong>: -${l.amount} ر.ع</div>
            <button class="btn-success" style="padding: 4px 8px; font-size: 0.8rem;" onclick="repayLoan(${i})">إرجاع المبلغ</button>
          </div>
        `).join('');
      }

      // 4. سجل الدفع
      const historyContainer = document.getElementById('historyContainer');
      if (!state.history || state.history.length === 0) {
        historyContainer.innerHTML = '<div style="text-align: center; color: #888; padding: 10px;">لا يوجد سجل دفع بعد</div>';
      } else {
        historyContainer.innerHTML = state.history.slice().reverse().map(h => `
          <div class="list-item">
            <div><strong>${h.name}</strong> دفع ${h.amount} ر.ع</div>
            <div style="font-size: 0.85rem; color: #666;">${h.date}</div>
          </div>
        `).join('');
      }
    }

    // الخصم الشهري التلقائي
    function applyMonthlyDeduction() {
      if (confirm("هل تريد بدء شهر جديد وتطبيق خصم 5 ريال عماني على جميع الأعضاء التسعة؟")) {
        state.members.forEach(m => m.balance -= 5);
        saveData();
      }
    }

    // تسجيل الدفع
    function submitPayment() {
      const idx = document.getElementById('payMemberSelect').value;
      const amount = parseFloat(document.getElementById('payAmount').value);
      const date = document.getElementById('payDate').value;

      if (!amount || amount <= 0) return alert("أدخل مبلغ صحيح");

      state.members[idx].balance += amount;
      state.totalFund = (state.totalFund || 0) + amount;
      if (!state.history) state.history = [];
      state.history.push({ name: state.members[idx].name, amount, date });

      closeModal('payModal');
      saveData();
    }

    // تسجيل قرض
    function submitLoan() {
      const borrower = document.getElementById('borrowerName').value.trim();
      const amount = parseFloat(document.getElementById('loanAmount').value);

      if (!borrower || !amount || amount <= 0) return alert("أدخل بيانات القرض بشكل صحيح");

      if (!state.loans) state.loans = [];
      state.loans.push({ borrower, amount });
      closeModal('loanModal');
      saveData();
    }

    // إرجاع القرض
    function repayLoan(index) {
      if (confirm(`هل تم إرجاع مبلغ ${state.loans[index].amount} ر.ع من قبل ${state.loans[index].borrower}؟`)) {
        state.loans.splice(index, 1);
        saveData();
      }
    }

    // تعديل رصيد عضو يدوياً
    function editBalance(idx) {
      const current = state.members[idx].balance;
      const newBal = prompt(`تعديل الرصيد الحالي لـ ${state.members[idx].name}:`, current);
      if (newBal !== null && !isNaN(newBal)) {
        state.members[idx].balance = parseFloat(newBal);
        saveData();
      }
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  </script>
</body>
</html>
